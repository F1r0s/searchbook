name: Update Public Books Catalog

on:
  # Allows triggering manually from GitHub Actions with a custom book count (default: 50)
  workflow_dispatch:
    inputs:
      books_count:
        description: 'Number of books to add'
        required: false
        default: '50'

  # Runs automatically every day at 02:00 UTC to add 50 new books
  schedule:
    - cron: '0 2 * * *'

# Prevent concurrent runs that could conflict on push
concurrency:
  group: catalog-update
  cancel-in-progress: true

jobs:
  update-catalog:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci --legacy-peer-deps || npm install --legacy-peer-deps

      - name: Run Book Scraper (Add 50 Books Daily)
        run: node scripts/generate-public-catalog.mjs --count=${{ github.event.inputs.books_count || '50' }}

      - name: Enrich Catalog & Sync Sitemaps
        run: |
          node scripts/enrich-catalog.mjs
          node scripts/generate-sitemaps.mjs

      - name: Verify Build for Cloudflare
        run: npm run build

      - name: Commit and Push Updated Catalog
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"

          # Stage all catalog files and updated sitemaps to prevent unstaged rebase errors
          git add src/data/public-books.json public/books.json public/sitemap*.xml

          if git diff --staged --quiet; then
            echo "Catalog and sitemaps are already up to date. No changes to commit."
          else
            git commit -m "chore(catalog): auto-add daily books & sync sitemaps [skip ci]"
            # Use --autostash with pull --rebase to ensure a clean sync with remote
            git pull --rebase --autostash origin ${{ github.ref_name }}
            git push origin HEAD:${{ github.ref_name }}
            echo "Successfully committed and pushed updated books catalog and sitemaps to repository!"
          fi
