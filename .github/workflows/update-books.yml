name: Update Public Books Catalog

on:
  # Allows you to trigger the scraper manually from the GitHub Actions tab anytime!
  workflow_dispatch:

  # Runs automatically every Sunday at midnight UTC
  schedule:
    - cron: '0 0 * * 0'

# Prevent concurrent runs that could conflict on push
concurrency:
  group: catalog-update
  cancel-in-progress: true

jobs:
  update-catalog:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci --legacy-peer-deps || npm install --legacy-peer-deps

      - name: Run Book Scraper
        run: node scripts/generate-public-catalog.mjs

      - name: Verify Build for Cloudflare
        run: npm run build

      - name: Commit and Push Updated Catalog
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add src/data/public-books.json public/books.json
          if git diff --staged --quiet; then
            echo "Catalog is already up to date. No changes to commit."
          else
            git commit -m "chore(catalog): auto-update public books catalog"
            git pull --rebase origin ${{ github.ref_name }}
            git push origin HEAD:${{ github.ref_name }}
            echo "Successfully committed and pushed updated books catalog to repository!"
          fi
