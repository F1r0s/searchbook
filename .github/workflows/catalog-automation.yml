name: Automated Book Catalog & pSEO Sitemap Sync

on:
  # Allows manual triggering from the Actions tab anytime
  workflow_dispatch:

concurrency:
  group: catalog-update
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  sync-and-verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --legacy-peer-deps || npm install --legacy-peer-deps

      - name: Enrich catalog & generate static sitemaps
        run: |
          npm run catalog:enrich
          npm run sitemaps:generate

      - name: Verify production build
        run: npm run build

      - name: Commit and push updated catalog and sitemaps
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add public/books.json src/data/public-books.json public/sitemap*.xml
          if git diff --staged --quiet; then
            echo "No catalog changes to commit."
          else
            git commit -m "chore(catalog): automated catalog & sitemap enrichment"
            git pull --rebase --autostash origin ${{ github.ref_name }}
            git push origin HEAD:${{ github.ref_name }}
          fi
