name: Automated Book Catalog & pSEO Sitemap Sync

on:
  schedule:
    # Runs daily at 03:00 UTC to enrich catalog and sync pSEO entries
    - cron: '0 3 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync-and-verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm install

      - name: Enrich catalog & generate static sitemaps
        run: |
          npm run catalog:enrich
          npm run sitemaps:generate

      - name: Verify production build
        run: npm run build

      - name: Commit and push updated catalog and sitemaps
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add public/books.json src/data/public-books.json public/sitemap*.xml
          if git diff --staged --quiet; then
            echo "No catalog changes to commit."
          else
            git commit -m "chore(catalog): automated catalog & sitemap enrichment [skip ci]"
            git push
          fi